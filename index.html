<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام الشؤون الإدارية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#16211f;--mut:#6b7a76;--line:#e2e8e6;--pri:#0f766e;--pri2:#e6f3f1;--dark:#0c3b36;--red:#c2410c;--amb:#b45309;--rad:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:15px;display:flex;min-height:100vh}
aside{width:236px;background:var(--dark);color:#e8f3f1;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px;border-bottom:1px solid #ffffff22;margin-bottom:10px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;box-sizing:border-box}
.nav button:hover{background:#ffffff14}.nav button.on{background:#fff;color:var(--dark);font-weight:600}
.nav hr{border:0;border-top:1px solid #ffffff22;margin:8px 0;width:100%}
main{flex:1;padding:24px 28px;min-width:0;max-width:1320px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0}.sub{color:var(--mut);margin:4px 0 0;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:inherit;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.btn,.actions button,.dnav button,.seg button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap;color:inherit}
.btn:hover,.actions button:hover,.dnav button:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.btn.danger{color:var(--red);border-color:#f3c9b5}
.add-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.add-grid label.wide{grid-column:span 2}
label>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.hint{font-size:12px;color:var(--mut);margin:8px 0 0}
.tbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 11px;font-size:13.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f1f5f4;font-weight:600;text-align:right;padding:9px 10px;font-size:13px;color:#33433f;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.grp td{background:var(--pri2);color:var(--pri);font-weight:600;font-size:13px;padding:6px 10px}
td.n{color:var(--mut);width:36px}
.cls{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:6px;padding:1px 8px;font-weight:600;font-size:13px}
a.nm{color:inherit;text-decoration:none;border-bottom:1px dashed #9aa;cursor:pointer}
.ib{border:0;background:none;cursor:pointer;padding:4px 7px;border-radius:6px;font-size:14px}.ib:hover{background:#f1f5f4}
.empty{text-align:center;color:var(--mut);padding:28px}
.dnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.dnav input{width:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.seg button{padding:7px 13px;font-size:14px}.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.rctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rctl input[type=date]{width:auto}.rctl label{display:flex;gap:6px;align-items:center;font-size:14px}.rctl input[type=checkbox]{width:auto}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.sc{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.sc span{font-size:12.5px;color:var(--mut);display:block}.sc b{font-size:22px;display:block;margin-top:4px}.sc small{color:var(--mut);font-size:12px}
.sc.click{cursor:pointer}.sc.click:hover{border-color:var(--pri)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rsec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}.rsec h4{margin:0 0 10px;font-size:14.5px}.rsec.full{grid-column:1/-1;margin-top:14px}
.bar{display:grid;grid-template-columns:120px 1fr 36px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{background:#eef2f1;border-radius:6px;height:12px;overflow:hidden}.bt i{display:block;height:100%;background:var(--pri);border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--pri);padding-bottom:10px;margin-bottom:12px;gap:10px;font-size:13px;line-height:1.7}
.rh .ttl{text-align:center}.rh h2{margin:0 0 4px;font-size:19px}.rh-l{text-align:left}
.report{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:20px}
.sig{display:flex;justify-content:space-around;margin-top:40px;text-align:center;font-size:14px;gap:10px}.sig div{min-width:140px}.sig span{display:block;margin-top:34px;border-top:1px dotted #999;padding-top:4px}
.warn{color:var(--red);font-weight:600}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;cursor:pointer;margin:2px}
.chip.on.s0{background:#15803d;color:#fff;border-color:#15803d}.chip.on.s1{background:var(--amb);color:#fff;border-color:var(--amb)}.chip.on.s2{background:var(--red);color:#fff;border-color:var(--red)}.chip.on.s3{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.chip.on.s4{background:#7c3aed;color:#fff;border-color:#7c3aed}.chip.on.s5{background:#475569;color:#fff;border-color:#475569}
.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;margin-bottom:16px}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut);height:100%;justify-content:flex-end}
.col .pair{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.col .pair i{width:12px;border-radius:4px 4px 0 0;min-height:2px}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.qa button{font:inherit;border:0;border-radius:16px;padding:16px 14px;cursor:pointer;color:#fff;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;min-height:116px;box-shadow:0 3px 10px #0000001a;transition:transform .1s,box-shadow .1s}
.qa button:hover{box-shadow:0 6px 16px #00000026}.qa button:active{transform:scale(.97)}
.qa .qi{font-size:30px;line-height:1;margin-bottom:auto}.qa .ql{font-size:16px;font-weight:700}.qa .qc{font-size:12.5px;opacity:.9}
.qa .badge{position:absolute;top:12px;left:12px;background:#ffffff38;border-radius:20px;padding:1px 11px;font-weight:700;font-size:16px}
.qlist td{padding:7px 8px;font-size:14px}
#sync{margin-top:14px;padding:10px 12px;border-top:1px solid #ffffff22;font-size:12.5px;line-height:1.8;opacity:.95}
#sync .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:#9ca3af}
#sync .ok{background:#4ade80}#sync .wait{background:#fbbf24}#sync .off{background:#f87171}
#gate{position:fixed;inset:0;background:var(--dark);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#gate.open{display:flex}
#gate .gbox{background:#fff;border-radius:20px;padding:28px 24px;width:min(440px,100%);text-align:center}
#gate h2{margin:6px 0 6px;font-size:21px}#gate p{color:var(--mut);line-height:1.8;margin:8px 0}
#gate .gi{font-size:46px}#gate input{margin:8px 0;text-align:center}#gate .btn{width:100%;margin-top:6px;padding:11px}
#gate a{color:var(--pri);cursor:pointer;font-size:14px}
.qrbox{text-align:center}.qrbox svg{width:min(280px,80vw);height:auto;display:block;margin:10px auto}
.qrcard{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;max-width:360px;margin:0 auto}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:12.5px;background:#f1f5f4}.tag.m{background:#ede9fe;color:#5b21b6}.tag.off{background:#fee2e2;color:#991b1b}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:16px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}
#modal h3{margin:0 0 14px}
.mact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;font-size:14px}
#toast.show{opacity:1}#toast.err{background:var(--red)}
.pledge{font-size:16px;line-height:2.2}.pledge p{margin:12px 0;text-align:justify}
.lvl{display:inline-block;border:1px solid var(--ink);border-radius:6px;padding:0 10px;font-size:13px}
.muted{color:var(--mut)}
#print{display:none}
@media print{
 @page{size:A4;margin:12mm}
 body{display:block;background:#fff}
 aside,main,#modal,#toast{display:none!important}
 #print{display:block}
 .report{border:0;padding:0}
 .rsec,.sc,tr{break-inside:avoid}
 th,tr.grp td,.cls{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:820px){
 body{flex-direction:column}
 aside{width:100%;height:auto;position:sticky;top:0;z-index:5;padding:8px}
 .brand{display:none}
 .nav{flex-direction:row;overflow-x:auto}
 .nav button{white-space:nowrap;padding:8px 12px}
 .nav hr{display:none}
 main{padding:16px}
 .add-grid label.wide{grid-column:span 1}
 .bar{grid-template-columns:90px 1fr 30px}
}
</style>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);

<script>
/* ===================== التخزين ===================== */
const LS='adminSys_cloud_v1';
const DEF={school:'مدارس المجد الجديد الأهلية',edu:'الإدارة العامة للتعليم بمنطقة حائل',principal:'',deputy:'',grades:'1,2,3',sections:7,start:'07:00',tstart:'06:45',threshold:3,lateThreshold:3,termStart:'',lastBackup:'',
 vdegrees:'الدرجة الأولى,الدرجة الثانية,الدرجة الثالثة,الدرجة الرابعة,الدرجة الخامسة,الدرجة السادسة',
 tpl_absence:'السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب/ {الاسم} المحترم\nنفيدكم بغياب ابنكم عن المدرسة اليوم {اليوم} {التاريخ}م الموافق {الهجري}.\nنأمل إفادة المدرسة بالعذر إن وجد، شاكرين تعاونكم.\n{المدرسة}',
 tpl_late:'السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب/ {الاسم} المحترم\nنفيدكم بتأخر ابنكم عن الحضور للمدرسة اليوم {اليوم} {التاريخ}م، حيث حضر الساعة {الوقت} متأخراً {الدقائق} دقيقة.\nنأمل الحرص على الحضور المبكر، شاكرين تعاونكم.\n{المدرسة}',
 tpl_perm:'السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب/ {الاسم} المحترم\nنفيدكم بأنه تم استئذان ابنكم من المدرسة اليوم {اليوم} {التاريخ}م الساعة {الوقت}، وتم تسليمه إلى/ {المستلم}.\n{المدرسة}',
 tpl_behavior:'السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب/ {الاسم} المحترم\nنفيدكم بأنه صدرت من ابنكم مخالفة سلوكية ({المخالفة}) بتاريخ {التاريخ}م، وتم اتخاذ الإجراء: {الإجراء}.\nنأمل متابعة ابنكم والتواصل مع إدارة المدرسة.\n{المدرسة}',
 tpl_pledge:'السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب/ {الاسم} المحترم\nنفيدكم بأن ابنكم وقّع تعهداً بخصوص ({النوع}) بتاريخ {التاريخ}م.\nنأمل متابعته والتواصل مع إدارة المدرسة.\n{المدرسة}'};
function fixDB(d){d=d||{};d.settings={...DEF,...(d.settings||{})};d.students=d.students||[];d.teachers=d.teachers||[];d.records=d.records||[];return d}
function load(){let d=null;try{const s=localStorage.getItem(LS);if(s)d=JSON.parse(s)}catch(e){}return fixDB(d)}
let DB=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}diffPush()}

/* ===================== المزامنة السحابية ===================== */
const SB_URL='https://bfrhfuicudumpexjhmhk.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcmhmdWljdWR1bXBleGpobWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NjY5MDMsImV4cCI6MjEwODA0MjkwM30.q2kvgEXv1MspPtFI1pGbzphxdeA1qUez6ib2C9gLqIs';
const LM='adminSys_cloud_meta';
let META=(()=>{try{return JSON.parse(localStorage.getItem(LM))||{}}catch(e){return {}}})();
// META: token, me{id,name,role}, since, SH{key:hash} = آخر نسخة متزامنة, OUT{key:{d|del}} = تغييرات بانتظار الرفع
function saveMeta(){try{localStorage.setItem(LM,JSON.stringify(META))}catch(e){}}
const isMgr=()=>META.me&&META.me.role==='manager';
const myName=()=>(META.me&&META.me.name)||'';
let SYNC={state:'',err:'',last:0,busy:false,timer:null,needRefresh:false};
async function rpc(fn,args){
 const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const e=new Error((j&&(j.message||j.hint))||t||('HTTP '+r.status));e.status=r.status;throw e}
 return j;
}
function hsh(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const COLL={rec:'records',stu:'students',tea:'teachers'};
function snap(){const m={};for(const c in COLL)DB[COLL[c]].forEach(o=>{if(o&&o.id)m[c+'/'+o.id]=JSON.stringify(o)});m['set/main']=JSON.stringify(DB.settings);return m}
function diffPush(){
 if(!META.SH)return;const cur=snap(),SH=META.SH,OUT=META.OUT=META.OUT||{};let n=0;
 for(const k in cur){const h=hsh(cur[k]);if(SH[k]!==h){SH[k]=h;OUT[k]={d:cur[k]};n++}}
 for(const k in SH)if(!(k in cur)){delete SH[k];OUT[k]={del:1};n++}
 if(n){saveMeta();showSync();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncNow,700)}
}
async function pushOut(){
 const OUT=META.OUT||{};
 while(true){
  const keys=Object.keys(OUT).slice(0,250);if(!keys.length)return;
  const sent=keys.map(k=>OUT[k]);
  const items=keys.map(k=>{const i=k.indexOf('/'),o=OUT[k];return{c:k.slice(0,i),i:k.slice(i+1),d:o.del?null:JSON.parse(o.d),x:!!o.del}});
  await rpc('app_push',{p_token:META.token,p_items:items});
  keys.forEach((k,j)=>{if(OUT[k]===sent[j])delete OUT[k]});saveMeta();
 }
}
async function pullIn(){
 const first=!META.SH;
 const res=await rpc('app_pull',{p_token:META.token,p_since:first?0:Math.max(0,(META.since||0)-30000)});
 META.me=res.me;
 if(first){META.SH={};META.OUT={};DB=fixDB(null)}
 const SH=META.SH,OUT=META.OUT||(META.OUT={});let changed=false;
 const idx={};for(const c in COLL){idx[c]=new Map();DB[COLL[c]].forEach((o,i)=>idx[c].set(o.id,i))}
 const del={rec:new Set(),stu:new Set(),tea:new Set()};
 for(const it of res.items||[]){
  const k=it.c+'/'+it.i;if(OUT[k])continue;
  if(it.c==='set'){if(it.x||!it.d)continue;const s=JSON.stringify(DB.settings);DB.settings={...DEF,...it.d};const n=JSON.stringify(DB.settings);SH[k]=hsh(n);if(s!==n)changed=true;continue}
  if(!COLL[it.c])continue;const arr=DB[COLL[it.c]],m=idx[it.c];
  if(it.x||!it.d){if(m.has(it.i)){del[it.c].add(it.i);changed=true}delete SH[k];continue}
  const s=JSON.stringify(it.d),h=hsh(s);if(SH[k]===h&&m.has(it.i))continue;
  if(m.has(it.i))arr[m.get(it.i)]=it.d;else{m.set(it.i,arr.length);arr.push(it.d)}
  SH[k]=h;changed=true;
 }
 for(const c in del)if(del[c].size)DB[COLL[c]]=DB[COLL[c]].filter(o=>!del[c].has(o.id));
 META.since=res.now;saveMeta();
 try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}
 if(first)diffPush();
 return changed||first;
}
async function syncNow(){
 if(!META.token||SYNC.busy)return;SYNC.busy=true;SYNC.state='busy';showSync();
 try{if(META.SH)await pushOut();const ch=await pullIn();await pushOut();SYNC.state='ok';SYNC.err='';SYNC.last=Date.now();if(ch)softRefresh()}
 catch(e){if(/invalid_token/.test(e.message)){SYNC.busy=false;return logout('تم إيقاف هذا الباركود أو استبداله. اطلب باركود جديد من المدير.')}SYNC.state='off';SYNC.err=e.message}
 finally{SYNC.busy=false;showSync()}
}
function busyTyping(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.value&&a.closest('#app,#mbox')&&a.type!=='file'}
function softRefresh(){if($('#gate').classList.contains('open'))return;if(busyTyping()){SYNC.needRefresh=true;return}SYNC.needRefresh=false;refreshUI()}
function showSync(){
 const el=$('#sync');if(!el)return;const p=Object.keys(META.OUT||{}).length;
 const [c,t]=SYNC.state==='off'?['off','غير متصل — يعمل محلياً'+(p?` (${p} بانتظار الرفع)`:'')]:p||SYNC.state==='busy'?['wait','جاري المزامنة...']:['ok','متزامن'+(SYNC.last?' · '+new Date(SYNC.last).toTimeString().slice(0,5):'')];
 el.innerHTML=`<div><span class="dot ${c}"></span>${t}</div>${META.me?`<div>👤 ${esc(META.me.name)} ${isMgr()?'<span class="tag m">مدير</span>':''}</div>`:''}`;
}
function logout(msg){META={};saveMeta();try{localStorage.removeItem(LS)}catch(e){}DB=fixDB(null);showGate('login',msg)}
function siteURL(){return /^https?:$/.test(location.protocol)?location.origin+location.pathname:(DB.settings.siteUrl||'')}

/* ---------- شاشة الدخول ---------- */
function showGate(mode,msg){
 const g=$('#gate'),b=$('#gbox');g.classList.add('open');
 if(mode==='loading')b.innerHTML=`<div class="gi">⏳</div><h2>جاري تحميل البيانات...</h2><p>${esc(msg||'')}</p>`;
 else if(mode==='error')b.innerHTML=`<div class="gi">📡</div><h2>تعذر الاتصال</h2><p>تأكد من الإنترنت ثم حاول مرة أخرى.</p><p class="muted" style="font-size:12px" dir="ltr">${esc(msg||'')}</p><button class="btn pri" onclick="boot()">إعادة المحاولة</button>`;
 else if(mode==='setup')b.innerHTML=`<div class="gi">🛠️</div><h2>إعداد النظام لأول مرة</h2><p>اكتب اسمك — ستكون <b>مدير النظام</b> وتصدر باركود الدخول لبقية الإداريين.</p><input id="g_name" placeholder="الاسم"><button class="btn pri" onclick="doSetup()">بدء الإعداد</button><p><a onclick="showGate('login')">رجوع</a></p>`;
 else b.innerHTML=`<div class="gi">🔐</div><h2>نظام الشؤون الإدارية</h2>${msg?`<p class="warn">${esc(msg)}</p>`:''}<p>امسح <b>باركود الدخول</b> الذي أعطاك إياه المدير بكاميرا جوالك، وسيفتح النظام مباشرة.</p>
 <p style="font-size:13px">أو الصق رابط الدخول هنا:</p><input id="g_link" dir="ltr" placeholder="https://...#k=..."><button class="btn pri" onclick="loginLink()">دخول</button><p style="margin-top:16px"><a onclick="trySetup()">إعداد النظام لأول مرة</a></p>`;
}
function hideGate(){$('#gate').classList.remove('open')}
function loginLink(){const v=$('#g_link').value.trim(),m=v.match(/k=([a-f0-9]{20,})/i)||v.match(/^([a-f0-9]{40,})$/i);if(!m)return toast('رابط غير صحيح','err');META={token:m[1].toLowerCase()};saveMeta();boot()}
async function trySetup(){try{const s=await rpc('app_status');if(s.initialized)return showGate('login','النظام مُعدّ مسبقاً. اطلب باركود الدخول من المدير.');showGate('setup')}catch(e){showGate('error',e.message)}}
async function doSetup(){const n=$('#g_name').value.trim();if(!n)return toast('اكتب اسمك','err');try{const t=await rpc('app_setup',{p_name:n});META={token:t};saveMeta();boot()}catch(e){showGate('login',/already/.test(e.message)?'النظام مُعدّ مسبقاً.':e.message)}}

let started=false;
async function boot(){
 const m=location.hash.match(/k=([a-f0-9]{20,})/i);
 if(m){const t=m[1].toLowerCase();if(META.token!==t){META={token:t};saveMeta();try{localStorage.removeItem(LS)}catch(e){}DB=fixDB(null)}history.replaceState(null,'',location.pathname+location.search)}
 if(!META.token)return showGate('login');
 if(!META.SH){showGate('loading');try{await pullIn();SYNC.state='ok';SYNC.last=Date.now()}catch(e){if(/invalid_token/.test(e.message))return logout('هذا الباركود غير صالح أو تم إيقافه.');return showGate('error',e.message)}}

}

  el.innerHTML=`<div class="tw"><table><thead><tr><th>#</th><th>الاسم</th><th>الصلاحية</th><th>آخر دخول</th><th>الحالة</th><th></th></tr></thead><tbody>${L.map((a,i)=>{const me=META.me&&a.id===META.me.id;return `<tr><td class="n">${i+1}</td><td><b>${esc(a.name)}</b>${me?' <small class="muted">(أنت)</small>':''}</td><td>${a.role==='manager'?'<span class="tag m">مدير</span>':'<span class="tag">إداري</span>'}</td><td class="muted">${a.last_seen?fmtShort(a.last_seen.slice(0,10))+' '+new Date(a.last_seen).toTimeString().slice(0,5):'—'}</td><td>${a.active?'فعّال':'<span class="tag off">موقوف</span>'}</td><td style="white-space:nowrap"><button class="btn" style="padding:4px 10px" onclick='reissue(${JSON.stringify(a.id)},${JSON.stringify(a.name)})'>🔄 باركود جديد</button>${me?'':` <button class="btn ${a.active?'danger':''}" style="padding:4px 10px" onclick='setActive(${JSON.stringify(a.id)},${!a.active})'>${a.active?'إيقاف':'تفعيل'}</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
 catch(e){el.innerHTML=`<p class="warn">تعذر تحميل القائمة: ${esc(e.message)}</p>`}
}

 try{const res=await rpc('app_admin_add',{p_token:META.token,p_name:n,p_role:r});$('#ad_name').value='';showQR(n,res.token);loadAdmins()}catch(e){toast(e.message,'err')}}

 try{const t=await rpc('app_admin_reissue',{p_token:META.token,p_id:id});if(META.me&&id===META.me.id){META.token=t;saveMeta()}showQR(name,t);loadAdmins()}catch(e){toast(e.message,'err')}}

function showQR(name,token){
 const base=siteURL();if(!base){toast('أدخل رابط الموقع في الإعدادات أولاً','err');return}

 openModal(`<div class="qrbox"><div class="qrcard" id="qrc"><h3 style="margin:0">${esc(DB.settings.school)}</h3><p class="muted" style="margin:4px 0">باركود الدخول لنظام الشؤون الإدارية</p>${qrSVG(url)}<b style="font-size:18px">${esc(name)}</b><p class="muted" style="font-size:12.5px">امسح الباركود بكاميرا الجوال — لا تشاركه مع أحد</p></div>
 <p class="hint">⚠️ يظهر هذا الباركود مرة واحدة فقط. اطبعه أو صوّره الآن. لو ضاع، أصدر باركود جديد ويتوقف القديم.</p>

/* ===================== أدوات ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652\u0640]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dayName=s=>DAYS[parse(s).getDay()];
const fmtShort=s=>s?s.split('-').reverse().join('/'):'';
const fmtDate=s=>dayName(s)+' '+fmtShort(s)+' م';
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const lateMins=(t,st)=>{const a=toMin(t),b=toMin(st);return a==null||b==null?0:Math.max(0,a-b)};
function hijri(s){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(parse(s))}catch(e){return ''}}
function hkey(d){try{return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'numeric'}).format(d)}catch(e){return d.getFullYear()+'-'+d.getMonth()}}
function hMonthName(d){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{month:'long',year:'numeric'}).format(d)}catch(e){return ''}}
function classes(){const g=String(DB.settings.grades).split(/[,،]/).map(x=>x.trim()).filter(Boolean);const n=+DB.settings.sections||7;const o=[];g.forEach(gr=>{for(let i=1;i<=n;i++)o.push(gr+pad(i))});return o}
const clsCmp=(a,b)=>String(a||'').localeCompare(String(b||''),undefined,{numeric:true});
const byClass=(a,b)=>clsCmp(a.cls,b.cls)||norm(a.name).localeCompare(norm(b.name),'ar');
function gradeOf(c){const g=String(c||'')[0];return({1:'الصف الأول',2:'الصف الثاني',3:'الصف الثالث'})[g]||('المستوى '+(g||'—'))}
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='show '+(t||'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2400)}
function openModal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');if(window._qMod||window._waMod){window._qMod=null;window._waMod=null;render()}}
function refreshUI(){const open=$('#modal').classList.contains('open');if(open&&window._waMod)waList(window._waMod);else if(open&&window._qMod)quickModal(window._qMod);else render()}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(rows,fname){const s='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([s],{type:'text/csv;charset=utf-8'}),fname+'.csv')}
function printHTML(h){$('#print').innerHTML=h;setTimeout(()=>window.print(),100)}
function cnt(arr,fn){const m=new Map();arr.forEach(r=>{const k=fn(r);if(k===undefined||k===null||k==='')return;m.set(k,(m.get(k)||0)+1)});return[...m.entries()]}
const desc=a=>a.sort((x,y)=>y[1]-x[1]);

/* ===================== الحالة والتنقل ===================== */
let view='home',curDate=today(),pending=null,rosterTab='students',rosterQ='';
let rep={mod:'absence',period:'week',date:today(),from:'',to:'',details:true};
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 $('#brand small').textContent=DB.settings.school;
 const app=$('#app');
 if(view==='home')app.innerHTML=homeView();
 else if(view==='teachers')app.innerHTML=teacherView();
 else if(MODS[view])app.innerHTML=modView(view);
 else if(view==='reports'){app.innerHTML=reportsView();runReport()}
 else if(view==='roster')app.innerHTML=rosterView();
 else if(view==='settings'){app.innerHTML=settingsView();if(isMgr())loadAdmins()}
 refreshLists();bindAfter();
}
function refreshLists(){$('#dl_students').innerHTML=DB.students.map(s=>`<option value="${esc(s.name)}">${esc(s.cls)}</option>`).join('')}
function shiftDate(n){let d=addDays(parse(curDate),n);while(d.getDay()===5||d.getDay()===6)d=addDays(d,n);curDate=iso(d);render()}
function dateNav(){return `<div class="dnav"><button onclick="shiftDate(-1)">→ السابق</button><input type="date" value="${curDate}" onchange="if(this.value){curDate=this.value;render()}"><button onclick="shiftDate(1)">التالي ←</button><button onclick="curDate=today();render()">اليوم</button></div>`}

/* ===================== الحقول ===================== */
function fieldInput(f,val,pre){
 const id=pre+f.k,v=esc(val??'');
 switch(f.type){
  case 'student':return `<input id="${id}" list="dl_students" value="${v}" autocomplete="off" placeholder="اكتب الاسم الثلاثي">`;
  case 'class':{const cl=classes();if(val&&!cl.includes(val))cl.push(val);return `<select id="${id}"><option value="">— اختر —</option>${cl.map(c=>`<option ${c===val?'selected':''}>${c}</option>`).join('')}</select>`}
  case 'nat':return `<input id="${id}" list="dl_nats" value="${v}">`;
  case 'select':return `<select id="${id}">${(typeof f.opts==='function'?f.opts():f.opts).map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
  case 'time':return `<input id="${id}" type="time" value="${v}">`;
  default:return `<input id="${id}" type="${f.type||'text'}" value="${v}" ${f.list?`list="${f.list}" autocomplete="off"`:''}>`;
 }
}
function collect(mod,pre){const o={};MODS[mod].fields.forEach(f=>{const el=$('#'+pre+f.k);o[f.k]=el?el.value.trim().replace(/\s+/g,' '):''});return o}
function validate(mod,o,pre){
 for(const f of MODS[mod].fields)if(f.req&&!o[f.k]){toast('أكمل حقل: '+f.l,'err');const el=$('#'+pre+f.k);el&&el.focus();return false}
 if(MODS[mod].kind==='student'&&o.name.split(' ').length<3&&!confirm('الاسم «'+o.name+'» ليس ثلاثياً. هل تريد المتابعة؟'))return false;
 return true;
}
const findStudent=n=>DB.students.find(s=>norm(s.name)===norm(n));
function autofill(mod,pre){const s=findStudent($('#'+pre+'name').value);if(!s)return;if($('#'+pre+'cls'))$('#'+pre+'cls').value=s.cls;if($('#'+pre+'nat')&&s.nat)$('#'+pre+'nat').value=s.nat;if(mod==='pledge')pledgeLevel(pre)}
function pledgeLevel(pre){const n=$('#'+pre+'name').value,t=$('#'+pre+'type').value;const c=DB.records.filter(r=>r.mod==='pledge'&&norm(r.name)===norm(n)&&r.type===t).length;$('#'+pre+'level').selectedIndex=Math.min(c,2)}
function learnStudent(o){if(!o.name||!o.cls)return;const s=findStudent(o.name);if(!s)DB.students.push({id:uid(),name:o.name,cls:o.cls,nat:o.nat||'',gphone:o.phone||''});else if(o.phone&&!s.gphone)s.gphone=o.phone}

function bindAfter(){if($('#qform'))bindForm(view,'q_','#qform')}
function bindForm(mod,pre,sel){
 const qf=$(sel);
 qf.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addRecord(mod,pre)}});
 const nm=$('#'+pre+'name');
 if(MODS[mod].kind==='student'){nm.addEventListener('change',()=>autofill(mod,pre));nm.addEventListener('input',()=>{if(findStudent(nm.value))autofill(mod,pre)})}
 if(mod==='pledge')$('#'+pre+'type').addEventListener('change',()=>pledgeLevel(pre));
 if(pending&&pending.mod===mod){for(const k in pending)if(k!=='mod'&&$('#'+pre+k))$('#'+pre+k).value=pending[k];pending=null;if(mod==='pledge')pledgeLevel(pre)}
 nm.focus({preventScroll:true});
}

const QA=[['absence','#0f766e','تسجيل غائب'],['late','#b45309','تسجيل متأخر'],['perm','#1d4ed8','استئذان طالب'],['behavior','#c2410c','مخالفة سلوكية'],['pledge','#7c3aed','تعهد'],['visitors','#475569','تسجيل زائر'],['teachers','#15803d','حضور المعلمين']];
function quickSum(r){return quickSum0(r)+(r.by?' · '+r.by:'')}
function quickSum0(r){const m=r.mod;return m==='absence'?r.excuse:m==='late'?`${r.time||''} · ${r.mins||0} د`:m==='perm'?`${r.time||''} · ${r.reason||''}`:m==='behavior'?r.violation:m==='pledge'?`${r.type} · ${r.level}`:`${r.purpose||''} · ${r.tin||''}`}
function quickModal(mod){
 window._qMod=mod;window._waMod=null;
 const m=MODS[mod],t=today(),recs=dayRecords(mod,t).sort((a,b)=>(b.created||0)-(a.created||0));
 openModal(`<div class="tbar"><h3 style="margin:0">${m.ic} ${m.t}</h3><span class="muted">${fmtDate(t)}</span></div>
 <div class="add-grid" id="mform">${m.fields.map(f=>`<label class="${f.wide?'wide':''}"><span>${f.l}${f.req?' *':''}</span>${fieldInput(f,f.def==='now'?nowTime():(f.type==='nat'?'سعودي':''),'m_')}</label>`).join('')}
 <button class="btn pri" onclick="addRecord('${mod}','m_')">＋ إضافة</button></div>
 <p class="hint">Enter للإضافة والانتقال للتالي مباشرة · النافذة تبقى مفتوحة حتى تنتهي</p>
 <div class="tbar" style="margin-top:16px"><b>المسجّلون اليوم (${recs.length})</b><div class="actions">${m.wa&&recs.length?`<button onclick="waList('${mod}')">💬 رسائل أولياء الأمور</button>`:''}<button onclick="window._qMod=null;$('#modal').classList.remove('open');curDate=today();go('${mod}')">الصفحة الكاملة</button></div></div>
 ${recs.length?`<div class="tw" style="max-height:280px;overflow:auto"><table class="qlist"><tbody>${recs.map((r,i)=>`<tr><td class="n">${recs.length-i}</td><td><b>${esc(r.name)}</b></td><td>${r.cls?`<span class="cls">${esc(r.cls)}</span>`:''}</td><td class="muted">${esc(quickSum(r))}</td><td style="white-space:nowrap;text-align:left">${mod==='visitors'&&!r.tout?`<button class="btn" style="padding:3px 10px;font-size:13px" onclick="visitorOut('${r.id}')">خروج</button>`:''}${m.wa?`<button class="ib" title="رسالة واتساب" onclick="sendWA('${r.id}')">${r.notified?'✅':'💬'}</button>`:''}${mod==='pledge'?`<button class="ib" onclick="printPledge('${r.id}')">🖨</button>`:''}${mod==='perm'?`<button class="ib" onclick="printPerm('${r.id}')">🖨</button>`:''}<button class="ib" title="حذف" onclick="delRec('${r.id}')">🗑</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:16px">لا يوجد تسجيل اليوم بعد</div>'}
 <div class="mact"><button class="btn" onclick="closeModal()">تم ✓</button></div>`);
 bindForm(mod,'m_','#mform');
}

/* ===================== شاشة القسم ===================== */
function dayRecords(mod,date){const r=DB.records.filter(x=>x.mod===mod&&x.date===date);return mod==='visitors'?r.sort((a,b)=>String(a.tin).localeCompare(String(b.tin))):r.sort(byClass)}
function modView(mod){
 const m=MODS[mod],recs=dayRecords(mod,curDate);
 return `<div class="head"><div><h1>${m.ic} ${m.t}</h1><p class="sub">${fmtDate(curDate)} · ${hijri(curDate)}</p></div>${dateNav()}</div>
 <div class="card"><div class="add-grid" id="qform">${m.fields.map(f=>`<label class="${f.wide?'wide':''}"><span>${f.l}${f.req?' *':''}</span>${fieldInput(f,f.def==='now'?nowTime():(f.type==='nat'?'سعودي':''),'q_')}</label>`).join('')}
 <button class="btn pri" onclick="addRecord('${mod}')">＋ إضافة</button></div>
 <p class="hint">${m.kind==='student'?'اكتب أول حروف الاسم واختره من القائمة وسيُعبّأ الفصل والجنسية تلقائياً · ':''}اضغط Enter للإضافة والانتقال للتالي مباشرة</p></div>
 <div class="card"><div class="tbar"><b>${recs.length} ${m.unit}</b><div class="actions">
 ${m.wa?`<button onclick="waList('${mod}')">💬 رسائل أولياء الأمور</button>`:''}<button onclick="printDay('${mod}')">🖨 طباعة الكشف</button><button onclick="quickReport('${mod}','day')">📊 تقرير اليوم</button><button onclick="quickReport('${mod}','week')">أسبوعي</button><button onclick="quickReport('${mod}','month')">شهري</button><button onclick="exportDay('${mod}')">⬇ Excel</button></div></div>
 ${recordsTable(mod,recs,true)}</div>`;
}
function cell(f,r,act){
 const v=r[f.k];
 if(f.k==='name'&&MODS[r.mod].kind==='student')return `<a class="nm" onclick="profileRec('${r.id}')">${esc(v)}</a>`;
 if(f.k==='cls')return v?`<span class="cls">${esc(v)}</span>`:'';
 if(f.k==='tout'&&!v&&act)return `<button class="btn" style="padding:3px 10px;font-size:13px" onclick="visitorOut('${r.id}')">تسجيل الخروج</button>`;
 if(f.k==='excuse'&&v==='بدون عذر')return `<span class="warn">${v}</span>`;
 return esc(v);
}
function recordsTable(mod,recs,act){
 const m=MODS[mod];if(!recs.length)return '<div class="empty">لا توجد سجلات لهذا اليوم</div>';
 const late=mod==='late',span=m.fields.length+1+(late?1:0)+(act?1:0);
 let h=`<div class="tw"><table><thead><tr><th>#</th>${m.fields.map(f=>`<th>${f.l}</th>`).join('')}${late?'<th>دقائق التأخر</th>':''}${act?'<th></th>':''}</tr></thead><tbody>`;
 let last=null;
 recs.forEach((r,i)=>{
  if(m.kind==='student'&&r.cls!==last){last=r.cls;h+=`<tr class="grp"><td colspan="${span}">فصل ${esc(r.cls||'—')} · ${recs.filter(x=>x.cls===r.cls).length}</td></tr>`}
  h+=`<tr><td class="n">${i+1}</td>${m.fields.map(f=>`<td>${cell(f,r,act)}</td>`).join('')}${late?`<td>${r.mins?`<b>${r.mins}</b> د`:'—'}</td>`:''}`;
  if(act)h+=`<td style="white-space:nowrap">${m.wa?`<button class="ib" title="${r.notified?'أُرسلت رسالة — إعادة الإرسال':'رسالة واتساب لولي الأمر'}" onclick="sendWA('${r.id}')">${r.notified?'✅':'💬'}</button>`:''}${mod==='pledge'?`<button class="ib" title="طباعة التعهد" onclick="printPledge('${r.id}')">🖨</button>`:''}${mod==='perm'?`<button class="ib" title="طباعة إذن الخروج" onclick="printPerm('${r.id}')">🖨</button>`:''}${mod==='behavior'?`<button class="ib" title="إنشاء تعهد سلوكي" onclick="pledgeFrom('${r.id}')">📝</button>`:''}<button class="ib" title="تعديل" onclick="editRec('${r.id}')">✏️</button><button class="ib" title="حذف" onclick="delRec('${r.id}')">🗑</button></td>`;
  h+='</tr>';
 });
 return h+'</tbody></table></div>';
}
function addRecord(mod,pre='q_'){
 const inModal=pre==='m_',date=inModal?today():curDate;
 const o=collect(mod,pre);if(!validate(mod,o,pre))return;
 if(MODS[mod].kind==='student'&&DB.records.some(r=>r.mod===mod&&r.date===date&&norm(r.name)===norm(o.name))&&!confirm('«'+o.name+'» مسجّل مسبقاً في هذا اليوم. إضافة مرة أخرى؟'))return;
 const r={id:uid(),mod,date,...o,created:Date.now(),by:myName()};
 if(mod==='late')r.mins=lateMins(o.time,DB.settings.start);
 DB.records.push(r);if(MODS[mod].kind==='student')learnStudent(o);save();
 if(inModal)quickModal(mod);else render();
 toast('تمت الإضافة ✓'+(mod==='late'&&r.mins?' · متأخر '+r.mins+' دقيقة':''));
 if(mod==='pledge'&&confirm('هل تريد طباعة التعهد الآن؟'))printPledge(r.id);

}

/* ===================== التقارير ===================== */
function periodRange(){
 const p=rep.period,d=parse(rep.date||today());
 if(p==='day')return[rep.date,rep.date,'تقرير يومي — '+fmtDate(rep.date),hijri(rep.date)];
 if(p==='week'){const s=addDays(d,-d.getDay()),e=addDays(s,4);return[iso(s),iso(e),'تقرير أسبوعي — من '+fmtShort(iso(s))+' إلى '+fmtShort(iso(e)),hijri(iso(s))+' — '+hijri(iso(e))]}
 if(p==='month'){const s=new Date(d.getFullYear(),d.getMonth(),1),e=new Date(d.getFullYear(),d.getMonth()+1,0);return[iso(s),iso(e),'تقرير شهري — '+new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'}).format(d)+' م',hijri(iso(s))+' — '+hijri(iso(e))]}
 if(p==='hmonth'){const k=hkey(d);let s=new Date(d),e=new Date(d);while(hkey(addDays(s,-1))===k)s=addDays(s,-1);while(hkey(addDays(e,1))===k)e=addDays(e,1);return[iso(s),iso(e),'تقرير شهري — '+hMonthName(d),fmtShort(iso(s))+' — '+fmtShort(iso(e))+' م']}
 const f=rep.from||rep.to,t=rep.to||rep.from;if(!f)return[null];const[a,b]=f<=t?[f,t]:[t,f];
 return[a,b,'تقرير لفترة — من '+fmtShort(a)+' إلى '+fmtShort(b),hijri(a)+' — '+hijri(b)];
}
function reportsView(){
 if(!rep.from){const d=new Date();rep.from=iso(new Date(d.getFullYear(),d.getMonth(),1));rep.to=today()}
 const P=[['day','يومي'],['week','أسبوعي'],['month','شهري ميلادي'],['hmonth','شهري هجري'],['custom','فترة محددة']];
 return `<div class="head"><h1>📊 التقارير والإحصائيات</h1></div><div class="card">
 <div class="seg">${Object.keys(MODS).map(k=>`<button class="${rep.mod===k?'on':''}" onclick="rep.mod='${k}';render()">${MODS[k].ic} ${MODS[k].short}</button>`).join('')}</div>
 <div class="seg">${P.map(([k,l])=>`<button class="${rep.period===k?'on':''}" onclick="rep.period='${k}';render()">${l}</button>`).join('')}</div>
 <div class="rctl">${rep.period==='custom'?`من <input type="date" value="${rep.from}" onchange="rep.from=this.value;runReport()"> إلى <input type="date" value="${rep.to}" onchange="rep.to=this.value;runReport()">`:`<span class="muted">التاريخ المرجعي</span><input type="date" value="${rep.date}" onchange="rep.date=this.value;runReport()">`}
 <label><input type="checkbox" ${rep.details?'checked':''} onchange="rep.details=this.checked;runReport()"> إظهار التفاصيل</label>
 <button class="btn pri" onclick="printHTML($('#repOut').innerHTML)">🖨 طباعة / PDF</button><button class="btn" onclick="exportReport()">⬇ Excel</button></div></div><div id="repOut"></div>`;
}
function periodRecs(){const[f,t]=periodRange();if(!f)return[];return DB.records.filter(r=>r.mod===rep.mod&&r.date>=f&&r.date<=t)}
function runReport(){
 const[f,,label,sub]=periodRange();const el=$('#repOut');if(!el)return;
 if(!f){el.innerHTML='<div class="card empty">اختر الفترة</div>';return}
 const recs=periodRecs(),m=MODS[rep.mod];
 const body=!recs.length?'<div class="empty">لا توجد سجلات في هذه الفترة</div>':m.kind==='student'?studentStats(rep.mod,recs):rep.mod==='visitors'?visitorStats(recs):teacherStats(recs);
 el.innerHTML=`<div class="report">${rHead('تقرير '+m.short,label,sub)}${body}${recs.length&&rep.details?detailsTable(rep.mod,recs):''}${sigs()}</div>`;
}
function exportReport(){const recs=periodRecs().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:byClass(a,b));const[f,t]=periodRange();csv(modRows(rep.mod,recs),'تقرير-'+MODS[rep.mod].short+'-'+f+'_'+t)}
function rHead(title,period,sub){const t=today();return `<div class="rh"><div>المملكة العربية السعودية<br>وزارة التعليم<br>${esc(DB.settings.edu)}<br><b>${esc(DB.settings.school)}</b></div><div class="ttl"><h2>${title}</h2><div>${period}</div>${sub?`<small class="muted">${sub}</small>`:''}</div><div class="rh-l">تاريخ الإصدار<br>${fmtShort(t)} م<br>${hijri(t)}</div></div>`}
function sigs(){return `<div class="sig"><div>وكيل شؤون الطلاب<span>${esc(DB.settings.deputy)||'&nbsp;'}</span></div><div>مدير المدرسة<span>${esc(DB.settings.principal)||'&nbsp;'}</span></div></div>`}
const scards=a=>`<div class="scards">${a.map(([l,v,s])=>`<div class="sc"><span>${l}</span><b>${v}</b>${s?`<small>${esc(s)}</small>`:''}</div>`).join('')}</div>`;
function bars(title,arr){const mx=Math.max(1,...arr.map(x=>x[1]));return `<div class="rsec"><h4>${title}</h4>${arr.length?arr.map(([l,c])=>`<div class="bar"><span class="bl" title="${esc(l)}">${esc(l)}</span><span class="bt"><i style="width:${c/mx*100}%"></i></span><b>${c}</b></div>`).join(''):'<p class="muted">لا توجد بيانات</p>'}</div>`}
function studentStats(mod,recs){
 const m=MODS[mod],st=new Map();
 recs.forEach(r=>{const k=norm(r.name);const e=st.get(k)||{name:r.name,cls:r.cls,c:0,mins:0,x:0,pts:0};e.c++;e.mins+=r.mins||0;e.pts+=+r.points||0;if(r.excuse==='بدون عذر')e.x++;e.cls=r.cls;st.set(k,e)});
 const S=[...st.values()].sort((a,b)=>b.c-a.c||clsCmp(a.cls,b.cls));
 const days=new Set(recs.map(r=>r.date)).size,multi=rep.period!=='day';
 const cl=classes();recs.forEach(r=>{if(r.cls&&!cl.includes(r.cls))cl.push(r.cls)});cl.sort(clsCmp);
 const byCls=cl.map(c=>[c,recs.filter(r=>r.cls===c).length]),top=desc([...byCls])[0];
 const C=[['إجمالي الحالات',recs.length],['عدد الطلاب',S.length],['أيام مسجّلة',days],['المتوسط اليومي',(recs.length/days).toFixed(1)],['أكثر فصل',top&&top[1]?top[0]:'—',top&&top[1]?top[1]+' حالة':''],['أكثر طالب',S[0].c+' مرات',S[0].name]];
 if(mod==='absence'){const x=recs.filter(r=>r.excuse==='بدون عذر').length;C.push(['بدون عذر',x],['بعذر / مستأذن',recs.length-x])}
 if(mod==='late'){const ms=recs.map(r=>r.mins||0);C.push(['متوسط التأخر',Math.round(ms.reduce((a,b)=>a+b,0)/ms.length)+' د'],['أطول تأخر',Math.max(...ms)+' د'])}
 if(mod==='behavior')C.push(['مجموع درجات الحسم',S.reduce((a,e)=>a+e.pts,0)]);
 const thr=m.noThr?Infinity:mod==='late'?+DB.settings.lateThreshold:+DB.settings.threshold;
 const ext=mod==='absence'?['بدون عذر',e=>e.x]:mod==='late'?['مجموع الدقائق',e=>e.mins]:mod==='behavior'?['مجموع الحسم',e=>e.pts]:null;
 let h=scards(C)+`<div class="rgrid"><div class="rsec"><h4>🏆 الأكثر ${m.short} (أعلى ١٥)</h4><div class="tw"><table><thead><tr><th>#</th><th>الطالب</th><th>الفصل</th><th>العدد</th>${ext?`<th>${ext[0]}</th>`:''}</tr></thead><tbody>${S.slice(0,15).map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.name)}</td><td><span class="cls">${esc(e.cls)}</span></td><td>${e.c>=thr?`<b class="warn">${e.c}</b>`:e.c}</td>${ext?`<td>${ext[1](e)}</td>`:''}</tr>`).join('')}</tbody></table></div></div>`;
 h+=bars('حسب الفصل',byCls)+bars('حسب الصف',cnt(recs,r=>gradeOf(r.cls)).sort((a,b)=>a[0].localeCompare(b[0],'ar')));
 if(multi){h+=bars('حسب أيام الأسبوع',[0,1,2,3,4].map(i=>[DAYS[i],recs.filter(r=>parse(r.date).getDay()===i).length]));h+=bars('حسب التاريخ',cnt(recs,r=>r.date).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,c])=>[dayName(d)+' '+fmtShort(d).slice(0,5),c]))}
 h+=bars(m.typeL,desc(cnt(recs,r=>r[m.typeKey])))+bars('حسب الجنسية',desc(cnt(recs,r=>r.nat)));
 if(mod==='late')h+=bars('فئات مدة التأخر',[['أقل من 10 د',recs.filter(r=>(r.mins||0)<10).length],['10 – 29 د',recs.filter(r=>r.mins>=10&&r.mins<30).length],['30 – 59 د',recs.filter(r=>r.mins>=30&&r.mins<60).length],['ساعة فأكثر',recs.filter(r=>r.mins>=60).length]]);
 (m.extraBars||[]).forEach(([t,k])=>{h+=bars(t,desc(cnt(recs,typeof k==='function'?k:r=>r[k])).slice(0,12))});
 const over=S.filter(e=>e.c>=thr);
 if(!m.noThr&&multi)h+=`<div class="rsec"><h4>⚠️ تجاوزوا حد التنبيه (${thr}+) — ${over.length} طالب</h4>${over.length?over.map(e=>`<div>${esc(e.name)} <span class="cls">${esc(e.cls)}</span> — <b>${e.c}</b></div>`).join(''):'<p class="muted">لا أحد</p>'}</div>`;
 return h+'</div>';
}
function visitorStats(recs){
 const du=recs.filter(r=>r.tin&&r.tout).map(r=>toMin(r.tout)-toMin(r.tin)).filter(x=>x>=0);
 return scards([['إجمالي الزيارات',recs.length],['زوار مختلفون',new Set(recs.map(r=>norm(r.name))).size],['متوسط مدة الزيارة',du.length?Math.round(du.reduce((a,b)=>a+b,0)/du.length)+' د':'—'],['بدون تسجيل خروج',recs.filter(r=>!r.tout).length]])
 +`<div class="rgrid">${bars('حسب صفة الزائر',desc(cnt(recs,r=>r.vtype)))}${bars('حسب الغرض',desc(cnt(recs,r=>r.purpose)))}${bars('الأكثر مقابلةً',desc(cnt(recs,r=>r.meet)).slice(0,10))}${rep.period!=='day'?bars('حسب أيام الأسبوع',[0,1,2,3,4].map(i=>[DAYS[i],recs.filter(r=>parse(r.date).getDay()===i).length])):''}${bars('حسب ساعة الدخول',cnt(recs,r=>r.tin?r.tin.slice(0,2)+':00':'').sort((a,b)=>a[0]<b[0]?-1:1))}</div>`;
}
function teacherStats(recs){
 const T=new Map();recs.forEach(r=>{const e=T.get(r.tid)||{name:r.name,s:{},mins:0,n:0};if(!r.status)return;e.s[r.status]=(e.s[r.status]||0)+1;e.mins+=r.mins||0;e.n++;T.set(r.tid,e)});
 const L=[...T.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar')),c=s=>recs.filter(r=>r.status===s).length;
 const pr=e=>e.n?Math.round(((e.s['حاضر']||0)+(e.s['متأخر']||0)+(e.s['مكلف بمهمة']||0)+(e.s['خروج مبكر']||0))/e.n*100)+'%':'—';
 return scards([['أيام مسجلة',new Set(recs.map(r=>r.date)).size],...TST.map(s=>[s,c(s)]),['دقائق التأخر',recs.reduce((a,r)=>a+(r.mins||0),0)]])
 +`<div class="rsec"><h4>ملخص كل معلم</h4><div class="tw"><table><thead><tr><th>#</th><th>المعلم</th>${TST.map(s=>`<th>${s}</th>`).join('')}<th>دقائق التأخر</th><th>نسبة الحضور</th></tr></thead><tbody>${L.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.name)}</td>${TST.map(s=>`<td>${e.s[s]||0}</td>`).join('')}<td>${e.mins}</td><td><b>${pr(e)}</b></td></tr>`).join('')}</tbody></table></div></div>
 <div class="rgrid" style="margin-top:14px">${bars('الأكثر غياباً',desc(L.map(e=>[e.name,e.s['غائب']||0])).filter(x=>x[1]).slice(0,10))}${bars('الأكثر تأخراً',desc(L.map(e=>[e.name,e.s['متأخر']||0])).filter(x=>x[1]).slice(0,10))}${bars('الإجازات',desc(L.map(e=>[e.name,e.s['إجازة']||0])).filter(x=>x[1]).slice(0,10))}</div>`;
}
function detailsTable(mod,recs){
 const m=MODS[mod],s=[...recs].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:byClass(a,b)),hm=mod==='late'||mod==='teachers';
 return `<div class="rsec full"><h4>التفاصيل (${s.length})</h4><div class="tw"><table><thead><tr><th>#</th><th>التاريخ</th>${m.fields.map(f=>`<th>${f.l}</th>`).join('')}${hm?'<th>د. التأخر</th>':''}</tr></thead><tbody>${s.map((r,i)=>`<tr><td class="n">${i+1}</td><td style="white-space:nowrap">${dayName(r.date)} ${fmtShort(r.date)}</td>${m.fields.map(f=>`<td>${f.k==='cls'&&r.cls?`<span class="cls">${esc(r.cls)}</span>`:esc(r[f.k])}</td>`).join('')}${hm?`<td>${r.mins||''}</td>`:''}</tr>`).join('')}</tbody></table></div></div>`;
}

function addStudent(){const n=$('#rs_name').value.trim().replace(/\s+/g,' '),c=$('#rs_cls').value,na=$('#rs_nat').value.trim();if(!n||!c)return toast('الاسم والفصل مطلوبان','err');if(findStudent(n))return toast('الطالب موجود مسبقاً','err');DB.students.push({id:uid(),name:n,cls:c,nat:na,gphone:$('#rs_gphone').value.trim()});save();render();toast('تمت الإضافة ✓');$('#rs_name').focus()}

function bulkAdd(type){
 let a=0,sk=0;$('#bulk').value.split(/\r?\n/).forEach(l=>{const p=l.split(/\t|,|،/).map(x=>x.trim().replace(/\s+/g,' '));if(!p[0])return;

}
function updStu(id,k,v){const s=DB.students.find(x=>x.id===id);s[k]=v.trim();save()}
function delStu(id){if(confirm('حذف الطالب من القائمة؟ (سجلاته السابقة تبقى)')){DB.students=DB.students.filter(s=>s.id!==id);save();render()}}
function updT(id,k,v){const t=DB.teachers.find(x=>x.id===id);t[k]=v.trim();save()}
function delT(id){if(confirm('حذف المعلم من القائمة؟ (سجلاته السابقة تبقى)')){DB.teachers=DB.teachers.filter(t=>t.id!==id);save();render()}}

/* ===================== الإعدادات والنسخ ===================== */
function settingsView(){
 const s=DB.settings,inp=(k,l,t='text')=>`<label><span>${l}</span><input type="${t}" value="${esc(s[k])}" onchange="DB.settings['${k}']=this.value;save();toast('تم الحفظ ✓')"></label>`;
 return `<div class="head"><h1>⚙️ الإعدادات والنسخ الاحتياطي</h1></div>
 <div class="card"><h3>بيانات المدرسة (تظهر في التقارير)</h3><div class="form">${inp('school','اسم المدرسة')}${inp('edu','إدارة التعليم')}${inp('principal','مدير المدرسة')}${inp('deputy','وكيل شؤون الطلاب')}</div></div>
 <div class="card"><h3>الفصول والدوام</h3><div class="form">${inp('grades','الصفوف (مفصولة بفاصلة)')}${inp('sections','عدد الفصول لكل صف','number')}${inp('start','بداية دوام الطلاب','time')}${inp('tstart','بداية دوام المعلمين','time')}</div><p class="hint">الفصول الحالية: ${classes().join(' · ')}</p></div>
 <div class="card"><h3>التنبيهات</h3><div class="form">${inp('threshold','تنبيه بعد غياب بدون عذر (أيام)','number')}${inp('lateThreshold','تنبيه بعد تأخر (مرات)','number')}${inp('termStart','احتساب التنبيهات من تاريخ (بداية الفصل)','date')}</div></div>
 <div class="card"><h3>⚠️ درجات المخالفات السلوكية</h3><div class="form">${inp('vdegrees','الدرجات (مفصولة بفاصلة) — طابقها مع قواعد السلوك المعتمدة لديكم')}</div></div>
 <div class="card"><h3>💬 نصوص رسائل واتساب</h3><p class="hint" style="margin-top:-6px">المتغيرات المتاحة: {الاسم} {الفصل} {التاريخ} {الهجري} {اليوم} {الوقت} {الدقائق} {السبب} {المستلم} {المخالفة} {الإجراء} {النوع} {المدرسة}</p>
 <div class="form">${[['absence','رسالة الغياب'],['late','رسالة التأخر'],['perm','رسالة الاستئذان'],['behavior','رسالة المخالفة'],['pledge','رسالة التعهد']].map(([k,l])=>`<label><span>${l}</span><textarea rows="7" onchange="DB.settings['tpl_${k}']=this.value;save();toast('تم الحفظ ✓')">${esc(s['tpl_'+k])}</textarea></label>`).join('')}</div>
 <div class="mact"><button class="btn" onclick="if(confirm('إرجاع النصوص الافتراضية؟')){['absence','late','perm','behavior','pledge'].forEach(k=>DB.settings['tpl_'+k]=DEF['tpl_'+k]);save();render()}">إرجاع النصوص الافتراضية</button></div></div>
 ${isMgr()?`<div class="card"><h3>👥 الإداريون وباركود الدخول</h3><p class="hint" style="margin-top:-6px">أضف كل إداري ليحصل على باركود دخول خاص به. كل تسجيل يُحفظ باسم من سجّله.</p>
 ${/^https?:$/.test(location.protocol)?'':`<div class="form" style="margin-bottom:10px">${inp('siteUrl','رابط الموقع (مطلوب لإنشاء الباركود)')}</div>`}
 <div class="add-grid"><label class="wide"><span>اسم الإداري</span><input id="ad_name"></label><label><span>الصلاحية</span><select id="ad_role"><option value="staff">إداري</option><option value="manager">مدير (يضيف الإداريين)</option></select></label><button class="btn pri" onclick="addAdmin()">＋ إضافة وإنشاء باركود</button></div>
 <div id="admList" style="margin-top:12px"><p class="muted">جاري التحميل...</p></div></div>`:''}
 <div class="card"><h3>☁️ المزامنة</h3><p class="hint" style="margin-top:-6px">البيانات محفوظة في السحابة ومتزامنة بين كل الأجهزة، وتعمل حتى لو انقطع الإنترنت ثم تُرفع تلقائياً. مسجّل باسم: <b>${esc(myName())}</b></p><div class="mact"><button class="btn" onclick="syncNow();toast('جاري المزامنة...')">🔄 مزامنة الآن</button><button class="btn danger" onclick="if(confirm('تسجيل الخروج من هذا الجهاز؟ ستحتاج الباركود للدخول مرة أخرى.'))logout()">تسجيل الخروج من هذا الجهاز</button></div></div>
 <div class="card"><h3>💾 النسخ الاحتياطي</h3><p class="hint" style="margin-top:-6px">نسخة إضافية على جهازك للاحتياط. لنقل بيانات النسخة القديمة (غير المتصلة): خذ منها نسخة احتياطية ثم استعدها هنا. آخر نسخة: <b>${s.lastBackup?fmtShort(s.lastBackup):'لا يوجد'}</b> · عدد السجلات: <b>${DB.records.length}</b></p>
 <div class="mact"><button class="btn pri" onclick="exportJSON()">⬇ حفظ نسخة احتياطية</button><label class="btn" style="display:inline-block">⬆ استعادة نسخة<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label><button class="btn" onclick="exportAll()">⬇ تصدير كل السجلات Excel</button>${isMgr()?'<button class="btn danger" onclick="wipe()">مسح كل البيانات</button>':''}</div></div>`;
}
function exportJSON(){DB.settings.lastBackup=today();save();download(new Blob([JSON.stringify(DB)],{type:'application/json'}),'نسخة-احتياطية-'+today()+'.json');toast('تم حفظ النسخة ✓');if(view!=='settings')render()}
function importJSON(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.records))throw 0;if(!confirm(`استبدال البيانات الحالية بالنسخة (${d.records.length} سجل)؟`))return;DB=fixDB(d);save();render();toast('تمت الاستعادة ✓ — جاري رفعها للسحابة')}catch(e){toast('ملف غير صالح','err')}};rd.readAsText(f)}
function exportAll(){Object.keys(MODS).forEach((k,i)=>setTimeout(()=>{const r=DB.records.filter(x=>x.mod===k).sort((a,b)=>a.date<b.date?-1:1);if(r.length)csv(modRows(k,r),'كل-'+MODS[k].short)},i*400))}
function wipe(){if(!confirm('سيتم حذف كل السجلات والأسماء نهائياً. متأكد؟'))return;if(prompt('اكتب: حذف')!=='حذف')return;DB=fixDB(null);save();render();toast('تم المسح')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
boot();
</script>
</body>
</html>
